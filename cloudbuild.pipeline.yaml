steps:
  # ── 1. Build the pipeline image ─────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-pipeline-image
    args:
      - build
      - -f
      - Dockerfile.pipeline
      - -t
      - us-central1-docker.pkg.dev/project-d84d7c5a-c91d-497b-b78/researcher-repo/pipeline-ingest:latest
      - .

  # ── 2. Push the image to Artifact Registry ───────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-pipeline-image
    args:
      - push
      - us-central1-docker.pkg.dev/project-d84d7c5a-c91d-497b-b78/researcher-repo/pipeline-ingest:latest
    waitFor: [build-pipeline-image]

  # ── 3. Create or update the Cloud Run Job definition ─────────────────────────
  # Uses production Cloud SQL / Pinecone / Vertex AI config identical to the
  # researcher-ranking service.  Secrets (DB_PASSWORD, PINECONE_API_KEY) are
  # read from Secret Manager at runtime via the same secret names.
  #
  # All values are inlined (no shell variables) so Cloud Build's substitution
  # engine has nothing to expand.
  #
  # Key env vars set on the job:
  #   TOPIC_IDS              — the 16 new CS/AI topics to ingest (run_job.py filter)
  #   LIMIT                  — max NEW researchers to collect; set to 'all' for unlimited
  #   MAX_COAUTHORS_TO_CHECK — coauthor depth limit (Stage 3b), 5 for initial run
  #   OPENALEX_CONTACT_EMAIL — service-account email for OpenAlex polite pool (~10 req/s)
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-job
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        echo "==> Creating/updating Cloud Run Job: pipeline-ingest"
        DEPLOY_ARGS=(
          --image=us-central1-docker.pkg.dev/project-d84d7c5a-c91d-497b-b78/researcher-repo/pipeline-ingest:latest
          --region=us-central1
          --service-account=researcher-run-sa@project-d84d7c5a-c91d-497b-b78.iam.gserviceaccount.com
          --set-cloudsql-instances=project-d84d7c5a-c91d-497b-b78:us-central1:researcher-mysql
          --memory=4Gi
          --cpu=2
          --task-timeout=86400
          --max-retries=0
          --set-env-vars=^##^DB_HOST=/cloudsql/project-d84d7c5a-c91d-497b-b78:us-central1:researcher-mysql##DB_USER=researcher_user##DB_NAME=researcher_db##DB_PORT=3306##GOOGLE_CLOUD_PROJECT=project-d84d7c5a-c91d-497b-b78##VERTEX_LOCATION=us-central1##OPENALEX_CONTACT_EMAIL=researcher-run-sa@project-d84d7c5a-c91d-497b-b78.iam.gserviceaccount.com##TOPIC_IDS=T10089,T10025,T10017,T10302,T11823,T10019,T10048,T11099,T10031,T11446,T10186,T10128,T10232,T10312,T10146,T10154##MAX_COAUTHORS_TO_CHECK=5##LIMIT=5000
          --set-secrets=DB_PASSWORD=db-password:latest,PINECONE_API_KEY=pinecone-key:latest
          --project=project-d84d7c5a-c91d-497b-b78
        )
        if gcloud run jobs create pipeline-ingest "${DEPLOY_ARGS[@]}" 2>/dev/null; then
          echo "==> Job created."
        else
          echo "==> Job exists, updating."
          gcloud run jobs update pipeline-ingest "${DEPLOY_ARGS[@]}"
        fi
    waitFor: [push-pipeline-image]

  # ── 4. Execute the job (async — returns immediately, job runs in the background) ─
  # The job logs appear in Cloud Logging under resource.type=cloud_run_job.
  # Monitor with:
  #   gcloud run jobs executions list --job=pipeline-ingest --region=us-central1
  # Stream logs with:
  #   gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=pipeline-ingest" \
  #     --limit=200 --order=asc --format="value(textPayload)"
  - name: gcr.io/cloud-builders/gcloud
    id: execute-job
    args:
      - run
      - jobs
      - execute
      - pipeline-ingest
      - --region=us-central1
      - --async
      - --project=project-d84d7c5a-c91d-497b-b78
    waitFor: [deploy-job]

timeout: 1200s # 20 min for build + push + deploy steps; job itself runs async
